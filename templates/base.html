{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GitHub Details{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="/">
        <span class="brand-mark">GH</span>
        <span>GitHub Details</span>
      </a>
      <div class="nav-links">
        <a href="/">Search</a>
      </div>
    </nav>
  </header>

  <main class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    GitHub Details fetches public profile and repository data from GitHub.
  </footer>
</body>
</html>
